<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudySquad - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4e73f8, #7c3aed);
      font-family: 'Segoe UI', sans-serif;
    }
    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .auth-card h2 {
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }
    .auth-card p.tagline {
      text-align: center;
      color: #6c757d;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .toggle-tabs {
      display: flex;
      background: #f1f3f9;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .toggle-tabs button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 8px 0;
      border-radius: 8px;
      font-weight: 600;
      color: #6c757d;
      transition: all 0.2s ease;
    }
    .toggle-tabs button.active {
      background: white;
      color: #4e73f8;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    #submitBtn {
      background: #4e73f8;
      border: none;
      font-weight: 600;
      padding: 10px;
    }
    #submitBtn:hover {
      background: #3d5fd6;
    }
    #spinner {
      display: none;
    }
    #emailField {
      display: none;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <h2>StudySquad</h2>
    <p class="tagline">Build your streak. Beat your squad.</p>

    <div class="toggle-tabs">
      <button id="loginTab" class="active">Log In</button>
      <button id="signupTab">Sign Up</button>
    </div>

    <input type="text" id="username" class="form-control mb-2" placeholder="Username">
    <div id="emailField">
      <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    </div>
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button id="submitBtn" class="btn btn-primary w-100 text-white">
      <span id="btnText">Log In</span>
      <span id="spinner" class="spinner-border spinner-border-sm ms-2"></span>
    </button>

    <p id="errorMsg" class="text-danger mt-3 mb-0 text-center" style="font-size: 14px;"></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
