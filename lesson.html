<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudySquad — Lesson Quiz</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <header class="mb-4 text-center">
            <h1 class="h3 mb-1">StudySquad Lesson</h1>
            <p class="text-muted mb-0">Answer each question to earn XP</p>
          </header>

          <section class="card shadow-sm">
            <div class="card-body p-4">
              <h2 id="question-text" class="h5 mb-4"></h2>

              <div id="options-container" class="d-grid gap-2 mb-4"></div>

              <div class="d-grid">
                <button
                  id="next-btn"
                  type="button"
                  class="btn btn-primary"
                  disabled
                >
                  Next
                </button>
              </div>
            </div>
          </section>

          <section
            id="summary"
            class="card shadow-sm mt-4 d-none"
            aria-live="polite"
          >
            <div class="card-body p-4 text-center">
              <h2 class="h4 mb-3">Lesson complete!</h2>
              <p id="summary-score" class="mb-2"></p>
              <p id="summary-xp" class="text-muted mb-0"></p>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- Firebase SDK (modular v10 — imported in js/firebase-config.js and js/lesson.js) -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="data/questions.js"></script>
    <script type="module" src="js/lesson.js"></script>
  </body>
</html>
