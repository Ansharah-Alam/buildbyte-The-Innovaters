<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
  <title>StudySquad - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4">StudySquad</h2>

    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button id="signupBtn" class="btn btn-primary w-100 mb-2">Sign Up</button>
    <button id="loginBtn" class="btn btn-outline-primary w-100">Log In</button>

    <p id="errorMsg" class="text-danger mt-3"></p>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
